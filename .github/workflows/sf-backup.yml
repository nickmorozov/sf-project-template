# Back up a single Salesforce sandbox.
# Dispatched by backup-sandboxes.yml on the org's source branch so
# environment secrets resolve correctly.
#
# Restores source tracking from cache, retrieves changed metadata,
# queries audit metadata from the Tooling API, exports SFDMU data,
# and commits everything to the org's backup/* branch.
#
# Respects environment variable:
#   SKIP_BACKUP — skip backup for this org

name: Sandbox Backup

on:
    workflow_dispatch:
        inputs:
            org_name:
                required: true
                type: choice
                options:
                    - DEV
                    - QA
                    - UAT
                    - PROD
                description: Display name (e.g., DEV, QA)
            org_alias:
                required: true
                type: choice
                options:
                    - dev
                    - qa
                    - uat
                    - prod
                description: Salesforce CLI alias (e.g., dev, qa)
            backup_branch:
                required: true
                type: string
                description: Backup branch to commit to (e.g., backup/dev)

permissions:
    contents: write

jobs:
    backup:
        name: Backup ${{ inputs.org_name }}
        runs-on: ubuntu-latest
        environment: ${{ inputs.org_alias == 'dev' && 'dev' || inputs.org_alias == 'qa' && 'qa' || inputs.org_alias == 'uat' && 'uat' || 'prod' }}
        if: vars.SKIP_BACKUP != 'true'
        env:
            ORG_ALIAS: ${{ inputs.org_alias }}
        steps:
            - name: Checkout (full history)
              uses: actions/checkout@v4
              env:
                  # Skip LFS materialization — backup workflow only needs git
                  # pointers, not the binary content (e.g. bin/aer). Avoids
                  # smudge failures when LFS objects aren't reachable.
                  GIT_LFS_SKIP_SMUDGE: '1'
              with:
                  fetch-depth: 0
                  submodules: recursive
                  lfs: false

            - name: Switch to backup branch
              env:
                  BACKUP_BRANCH: ${{ inputs.backup_branch }}
                  SOURCE_BRANCH: ${{ github.ref_name }}
                  GIT_LFS_SKIP_SMUDGE: '1'
              run: |
                  git config user.name "github-actions[bot]"
                  git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

                  git fetch origin "$BACKUP_BRANCH" 2>/dev/null || true

                  if git show-ref --verify --quiet "refs/remotes/origin/$BACKUP_BRANCH"; then
                      git checkout "$BACKUP_BRANCH"
                      echo "Merging $SOURCE_BRANCH into $BACKUP_BRANCH..."
                      git merge --no-edit "origin/$SOURCE_BRANCH" --strategy-option theirs || true
                  else
                      echo "Backup branch does not exist. Creating from $SOURCE_BRANCH..."
                      git checkout -b "$BACKUP_BRANCH" "origin/$SOURCE_BRANCH"
                  fi

                  # Defensive: if a merge got stuck mid-way (e.g. LFS smudge
                  # failure swallowed by `|| true`), abort so we have a clean
                  # working tree before the workflow-files reset.
                  if git rev-parse -q --verify MERGE_HEAD >/dev/null; then
                      echo "::warning::Merge left an unresolved state — aborting."
                      git merge --abort || true
                  fi

                  # GITHUB_TOKEN cannot push workflow file changes (needs
                  # `workflow` scope). Force `.github/workflows/` to match
                  # `origin/$BACKUP_BRANCH` (or empty if remote backup branch
                  # has no workflows) and fold the reset into the tip commit
                  # so the push diff for workflow files is zero.
                  git rm -rf --cached --ignore-unmatch --quiet .github/workflows
                  rm -rf .github/workflows
                  if git show-ref --verify --quiet "refs/remotes/origin/$BACKUP_BRANCH" \
                      && git ls-tree -r --name-only "origin/$BACKUP_BRANCH" -- .github/workflows | grep -q .; then
                      git checkout "origin/$BACKUP_BRANCH" -- .github/workflows
                  fi
                  if ! git diff --cached --quiet; then
                      git commit --amend --no-edit
                  fi

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: '23'

            - name: Install Salesforce CLI
              run: |
                  npm install --global @salesforce/cli
                  echo "$(npm prefix -g)/bin" >> "$GITHUB_PATH"

            - name: Authenticate
              env:
                  SFDX_AUTH_URL: ${{ secrets.SFDX_AUTH_URL }}
              run: |
                  printf '%s' "$SFDX_AUTH_URL" > /tmp/sfdx-auth-url.txt
                  sf org login sfdx-url \
                      --sfdx-url-file /tmp/sfdx-auth-url.txt \
                      --alias "$ORG_ALIAS" \
                      --set-default
                  rm -f /tmp/sfdx-auth-url.txt

            # ── Source Tracking ────────────────────────────────────────────
            # Source tracking is only supported on Developer / Developer Pro /
            # Partial Copy sandboxes (DEV). Full sandboxes (QA, UAT) and
            # production (PROD) don't support it, so for those we fall back
            # to a manifest-based "retrieve everything" backup instead of
            # diffing against tracking state.

            - name: Restore source tracking
              id: tracking-cache
              uses: actions/cache/restore@v4
              with:
                  path: .sf/orgs/
                  key: source-tracking-${{ inputs.org_alias }}-${{ github.run_id }}-${{ github.run_attempt }}
                  restore-keys: source-tracking-${{ inputs.org_alias }}-

            - name: Initialize tracking (first run)
              id: init-tracking
              if: steps.tracking-cache.outputs.cache-hit != 'true'
              run: |
                  echo "No previous tracking state found. Initializing baseline..."
                  if sf project reset tracking --target-org "$ORG_ALIAS" --no-prompt 2>/tmp/track-err.log; then
                      echo "supported=true" >> "$GITHUB_OUTPUT"
                  else
                      if grep -qiE 'NonSourceTrackedOrg|does not have source tracking' /tmp/track-err.log; then
                          echo "::notice::Org '$ORG_ALIAS' is not source-tracked (Full sandbox or prod). Falling back to manifest-based full retrieve."
                          echo "supported=false" >> "$GITHUB_OUTPUT"
                      else
                          echo "::error::Tracking init failed for unexpected reason:"
                          cat /tmp/track-err.log >&2
                          exit 1
                      fi
                  fi

            # Consolidate `supported` across cache-hit and init-tracking paths.
            - name: Tracking flag
              id: tracking
              env:
                  CACHE_HIT: ${{ steps.tracking-cache.outputs.cache-hit }}
                  INIT_SUPPORTED: ${{ steps.init-tracking.outputs.supported }}
              run: |
                  if [ "$CACHE_HIT" = "true" ] || [ "$INIT_SUPPORTED" = "true" ]; then
                      echo "supported=true" >> "$GITHUB_OUTPUT"
                      echo "Source tracking: supported (delta retrieve)"
                  else
                      echo "supported=false" >> "$GITHUB_OUTPUT"
                      echo "Source tracking: not supported (full manifest retrieve)"
                  fi

            # ── Tracked path: detect & retrieve only changed components ────

            - name: Detect changes (tracked)
              id: changes
              if: steps.tracking.outputs.supported == 'true'
              run: |
                  sf project retrieve preview --target-org "$ORG_ALIAS" --json \
                      > /tmp/retrieve-preview.json 2>&1 || true

                  CHANGE_COUNT=$(node -e "
                      try {
                          const p = require('/tmp/retrieve-preview.json');
                          const f = p.result?.fileResponses || [];
                          process.stdout.write(String(f.length));
                      } catch { process.stdout.write('0'); }
                  ")

                  echo "change_count=$CHANGE_COUNT" >> "$GITHUB_OUTPUT"

                  if [ "$CHANGE_COUNT" -gt 0 ]; then
                      echo "has_changes=true" >> "$GITHUB_OUTPUT"
                      echo "Detected $CHANGE_COUNT changed component(s)."
                  else
                      echo "has_changes=false" >> "$GITHUB_OUTPUT"
                      echo "No metadata changes detected."
                  fi

            - name: Audit changes (tracked)
              if: steps.tracking.outputs.supported == 'true' && steps.changes.outputs.has_changes == 'true'
              env:
                  ORG_NAME: ${{ inputs.org_name }}
              run: node scripts/node/backup-audit.js "$ORG_ALIAS" "$ORG_NAME" /tmp/retrieve-preview.json

            - name: Retrieve changed metadata (tracked)
              if: steps.tracking.outputs.supported == 'true' && steps.changes.outputs.has_changes == 'true'
              run: |
                  sf project retrieve start \
                      --target-org "$ORG_ALIAS" \
                      --ignore-conflicts \
                      --wait 30

            # ── Non-tracked path: manifest-based full retrieve ─────────────
            # Builds a package.xml that lists every metadata type the org
            # supports, retrieves it all, and lets the downstream `git diff`
            # detect what changed since the last backup commit.

            - name: Generate full manifest (non-tracked)
              if: steps.tracking.outputs.supported != 'true'
              run: |
                  mkdir -p backup-manifest
                  sf org list metadata-types --target-org "$ORG_ALIAS" --json > /tmp/mdtypes.json
                  node -e "
                      const fs = require('fs');
                      const data = JSON.parse(fs.readFileSync('/tmp/mdtypes.json','utf8'));
                      const types = (data.result?.metadataObjects || []).map(o => o.xmlName).filter(Boolean);
                      // These either aren't retrievable with wildcard members or are noisy.
                      const skip = new Set(['StandardValueSet','GlobalValueSetTranslation','StandardValueSetTranslation','InstalledPackage','ManagedTopic','Settings','UserAccessPolicy']);
                      const usable = [...new Set(types)].filter(t => !skip.has(t)).sort();
                      let xml = '<?xml version=\"1.0\" encoding=\"UTF-8\"?>\n<Package xmlns=\"http://soap.sforce.com/2006/04/metadata\">\n';
                      for (const t of usable) xml += '  <types><name>' + t + '</name><members>*</members></types>\n';
                      xml += '  <version>61.0</version>\n</Package>\n';
                      fs.writeFileSync('backup-manifest/package.xml', xml);
                      console.log('Generated manifest with ' + usable.length + ' metadata types.');
                  "
                  echo "── manifest preview (first 20 lines) ──"
                  head -20 backup-manifest/package.xml

            - name: Retrieve full metadata (non-tracked)
              if: steps.tracking.outputs.supported != 'true'
              run: |
                  sf project retrieve start \
                      --target-org "$ORG_ALIAS" \
                      --manifest backup-manifest/package.xml \
                      --ignore-conflicts \
                      --wait 60

            # ── Export SFDMU Data ──────────────────────────────────────────
            # Always export data regardless of metadata changes — data
            # records can be modified without touching metadata.

            - name: Install SFDMU
              run: echo y | sf plugins install sfdmu --silent

            - name: Install dependencies
              run: npm ci

            - name: Export SFDMU data
              run: |
                  npm run data -- export -s "$ORG_ALIAS" --verbose

            # ── Persist & Commit ───────────────────────────────────────────

            - name: Save source tracking
              if: always() && steps.tracking.outputs.supported == 'true'
              uses: actions/cache/save@v4
              with:
                  path: .sf/orgs/
                  key: source-tracking-${{ inputs.org_alias }}-${{ github.run_id }}-${{ github.run_attempt }}

            - name: Commit and push
              env:
                  BACKUP_BRANCH: ${{ inputs.backup_branch }}
                  ORG_NAME: ${{ inputs.org_name }}
              run: |
                  git add --all

                  if git diff --cached --quiet; then
                      echo "No changes to commit."
                      exit 0
                  fi

                  CHANGES=$(git diff --cached --stat | tail -1)
                  git commit -m "[$ORG_NAME] $(date -u +%Y-%m-%d) sandbox backup

                  $CHANGES"
                  git push origin "$BACKUP_BRANCH"

    notify:
        needs: backup
        if: failure()
        uses: ./.github/workflows/slack-notify.yml
        with:
            workflow_name: Sandbox Backup (${{ inputs.org_name }})
            result: failure
        secrets:
            SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
            SLACK_CHANNEL_ID: ${{ secrets.SLACK_CHANNEL_ID }}
